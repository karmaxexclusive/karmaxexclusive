<svg width="480" height="260" viewBox="0 0 480 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats for karmaxexclusive">
<title>GitHub Stats — karmaxexclusive</title>
<defs>
  <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#170c28"/>
    <stop offset="100%" stop-color="#0a0614"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff3d8a"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="sGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .lbl { font-family:'Segoe UI',Arial,sans-serif; font-size:13px; fill:#9a8fc2; }
    .val { font-family:'Segoe UI',Arial,sans-serif; font-size:20px; font-weight:700; fill:#ece7fb; }
  </style>
</defs>

<rect x="1" y="1" width="478" height="258" rx="18" fill="url(#sBg)" stroke="#3a2359"/>
<text x="24" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#ece7fb">📊 GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(96,148)">
  <circle r="62" fill="none" stroke="#241536" stroke-width="10"/>
  <circle r="62" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90)" filter="url(#sGlow)">
    <animate attributeName="stroke-dashoffset" values="389.6;62" dur="1.6s" begin="0.3s" fill="freeze"/>
  </circle>
  <text text-anchor="middle" y="-2" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#ece7fb" opacity="0">
    A+
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="2s" begin="0.3s" fill="freeze"/>
  </text>
  <text text-anchor="middle" y="20" class="lbl" opacity="0">
    RANK
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="2s" begin="0.3s" fill="freeze"/>
  </text>
</g>

<!-- stat rows -->
<g transform="translate(196,66)">
  <g opacity="0" transform="translate(-30,0)">
    <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" begin="0.4s" dur="0.5s" fill="freeze"/>
    <text class="val" x="0" y="16">128</text>
    <text class="lbl" x="0" y="34">Total Stars Earned</text>
  </g>
  <g opacity="0" transform="translate(-30,50)">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-30,50;0,50" begin="0.6s" dur="0.5s" fill="freeze"/>
    <text class="val" x="0" y="16">1.4k+</text>
    <text class="lbl" x="0" y="34">Total Commits</text>
  </g>
  <g opacity="0" transform="translate(-30,100)">
    <animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-30,100;0,100" begin="0.8s" dur="0.5s" fill="freeze"/>
    <text class="val" x="0" y="16">42</text>
    <text class="lbl" x="0" y="34">Total PRs</text>
  </g>
  <g opacity="0" transform="translate(-30,150)">
    <animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-30,150;0,150" begin="1.0s" dur="0.5s" fill="freeze"/>
    <text class="val" x="0" y="16">40+</text>
    <text class="lbl" x="0" y="34">Public Repositories</text>
  </g>
</g>
</svg>
