<svg width="480" height="260" viewBox="0 0 480 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages for karmaxexclusive">
<title>Top Languages — karmaxexclusive</title>
<defs>
  <linearGradient id="lBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#170c28"/>
    <stop offset="100%" stop-color="#0a0614"/>
  </linearGradient>
  <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f1e05a"/><stop offset="100%" stop-color="#f7d842"/></linearGradient>
  <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3178c6"/><stop offset="100%" stop-color="#5aa6ff"/></linearGradient>
  <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#61dafb"/><stop offset="100%" stop-color="#35e6c9"/></linearGradient>
  <linearGradient id="barGrad4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3572A5"/><stop offset="100%" stop-color="#5aa0e0"/></linearGradient>
  <linearGradient id="barGrad5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0A2E20"/><stop offset="100%" stop-color="#1a6b3d"/></linearGradient>
  <style>
    .lbl { font-family:'Segoe UI',Arial,sans-serif; font-size:13px; fill:#ece7fb; }
    .pct { font-family:'Segoe UI',Arial,sans-serif; font-size:12px; fill:#9a8fc2; }
    .trk { fill:#241536; }
  </style>
</defs>

<rect x="1" y="1" width="478" height="258" rx="18" fill="url(#lBg)" stroke="#3a2359"/>
<text x="24" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#ece7fb">🛠️ Most Used Languages</text>

<g transform="translate(24,60)">
  <!-- JavaScript 32% -->
  <text class="lbl" x="0" y="0">JavaScript</text><text class="pct" x="420" y="0" text-anchor="end">32%</text>
  <rect class="trk" x="0" y="8" width="432" height="10" rx="5"/>
  <rect x="0" y="8" width="0" height="10" rx="5" fill="url(#barGrad1)"><animate attributeName="width" values="0;138" dur="1.1s" begin="0.3s" fill="freeze"/></rect>

  <!-- TypeScript 24% -->
  <text class="lbl" x="0" y="42">TypeScript</text><text class="pct" x="420" y="42" text-anchor="end">24%</text>
  <rect class="trk" x="0" y="50" width="432" height="10" rx="5"/>
  <rect x="0" y="50" width="0" height="10" rx="5" fill="url(#barGrad2)"><animate attributeName="width" values="0;104" dur="1.1s" begin="0.5s" fill="freeze"/></rect>

  <!-- React/JSX 18% -->
  <text class="lbl" x="0" y="84">React / JSX</text><text class="pct" x="420" y="84" text-anchor="end">18%</text>
  <rect class="trk" x="0" y="92" width="432" height="10" rx="5"/>
  <rect x="0" y="92" width="0" height="10" rx="5" fill="url(#barGrad3)"><animate attributeName="width" values="0;78" dur="1.1s" begin="0.7s" fill="freeze"/></rect>

  <!-- Python 16% -->
  <text class="lbl" x="0" y="126">Python</text><text class="pct" x="420" y="126" text-anchor="end">16%</text>
  <rect class="trk" x="0" y="134" width="432" height="10" rx="5"/>
  <rect x="0" y="134" width="0" height="10" rx="5" fill="url(#barGrad4)"><animate attributeName="width" values="0;69" dur="1.1s" begin="0.9s" fill="freeze"/></rect>

  <!-- Django/Other 10% -->
  <text class="lbl" x="0" y="168">Django</text><text class="pct" x="420" y="168" text-anchor="end">10%</text>
  <rect class="trk" x="0" y="176" width="432" height="10" rx="5"/>
  <rect x="0" y="176" width="0" height="10" rx="5" fill="url(#barGrad5)"><animate attributeName="width" values="0;43" dur="1.1s" begin="1.1s" fill="freeze"/></rect>
</g>
</svg>
