<svg width="420" height="330" viewBox="0 0 420 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="statsRound"><rect width="420" height="330" rx="18"/></clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#a742ff"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#statsRound)">
    <rect width="420" height="330" fill="#150a22"/>
    <rect x="1" y="1" width="418" height="328" rx="17" fill="none" stroke="#5b2a86"/>
    <text x="20" y="34" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#f5eefc">📊 karmaxexclusive's GitHub Stats</text>
    <line x1="20" y1="46" x2="400" y2="46" stroke="#5b2a86"/>

    
    <g transform="translate(20,150)" opacity="0">
      <animate attributeName="opacity" begin="0.50s" dur="0.5s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="-30 0;0 0" begin="0.50s" dur="0.5s" fill="freeze"/>
      <circle cx="6" cy="-5" r="4" fill="#ff5fa2"/>
      <text x="20" y="0" font-family="Consolas, monospace" font-size="15" fill="#f5eefc">Total Stars:</text>
      <text x="330" y="0" text-anchor="end" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#ff5fa2">18</text>
    </g>
    <g transform="translate(20,184)" opacity="0">
      <animate attributeName="opacity" begin="0.65s" dur="0.5s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="-30 0;0 0" begin="0.65s" dur="0.5s" fill="freeze"/>
      <circle cx="6" cy="-5" r="4" fill="#ff5fa2"/>
      <text x="20" y="0" font-family="Consolas, monospace" font-size="15" fill="#f5eefc">Total Commits:</text>
      <text x="330" y="0" text-anchor="end" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#ff5fa2">540</text>
    </g>
    <g transform="translate(20,218)" opacity="0">
      <animate attributeName="opacity" begin="0.80s" dur="0.5s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="-30 0;0 0" begin="0.80s" dur="0.5s" fill="freeze"/>
      <circle cx="6" cy="-5" r="4" fill="#ff5fa2"/>
      <text x="20" y="0" font-family="Consolas, monospace" font-size="15" fill="#f5eefc">Total PRs:</text>
      <text x="330" y="0" text-anchor="end" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#ff5fa2">24</text>
    </g>
    <g transform="translate(20,252)" opacity="0">
      <animate attributeName="opacity" begin="0.95s" dur="0.5s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="-30 0;0 0" begin="0.95s" dur="0.5s" fill="freeze"/>
      <circle cx="6" cy="-5" r="4" fill="#ff5fa2"/>
      <text x="20" y="0" font-family="Consolas, monospace" font-size="15" fill="#f5eefc">Total Issues:</text>
      <text x="330" y="0" text-anchor="end" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#ff5fa2">11</text>
    </g>
    <g transform="translate(20,286)" opacity="0">
      <animate attributeName="opacity" begin="1.10s" dur="0.5s" to="1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="-30 0;0 0" begin="1.10s" dur="0.5s" fill="freeze"/>
      <circle cx="6" cy="-5" r="4" fill="#ff5fa2"/>
      <text x="20" y="0" font-family="Consolas, monospace" font-size="15" fill="#f5eefc">Contributed To:</text>
      <text x="330" y="0" text-anchor="end" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#ff5fa2">6</text>
    </g>

    <!-- rank ring -->
    <g transform="translate(355,90)">
      <circle r="46" fill="none" stroke="#1c0f2e" stroke-width="9"/>
      <circle r="46" fill="none" stroke="url(#ringGrad)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="208.1 1000" transform="rotate(-90)">
        <animate attributeName="stroke-dasharray" from="0 1000" to="208.1 1000" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </circle>
      <text x="0" y="6" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#f5eefc">A</text>
    </g>
    <text x="355" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#c9a6e8">RANK</text>
  </g>
</svg>